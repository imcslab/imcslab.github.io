<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Cross-National AI Mobility: cross-domain perception and LLM/VLM-based multimodal decision</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7688"/>
    </marker>
  </defs>
  <rect width="1200" height="400" fill="#fff"/>

  <!-- Domains -->
  <rect x="30" y="40" width="230" height="130" rx="10" fill="#f5f7fa" stroke="#6b7688" stroke-width="2"/>
  <text x="145" y="82" text-anchor="middle" font-size="21" font-weight="700" fill="#0a1020">Korea</text>
  <text x="145" y="112" text-anchor="middle" font-size="15" fill="#4a5568">Right-hand traffic,</text>
  <text x="145" y="134" text-anchor="middle" font-size="15" fill="#4a5568">local signage and rules</text>

  <rect x="30" y="230" width="230" height="130" rx="10" fill="#f5f7fa" stroke="#6b7688" stroke-width="2"/>
  <text x="145" y="272" text-anchor="middle" font-size="21" font-weight="700" fill="#0a1020">Japan</text>
  <text x="145" y="302" text-anchor="middle" font-size="15" fill="#4a5568">Left-hand traffic,</text>
  <text x="145" y="324" text-anchor="middle" font-size="15" fill="#4a5568">local signage and rules</text>

  <path d="M260 105 C 290 105, 290 200, 318 200" fill="none" stroke="#6b7688" stroke-width="2" marker-end="url(#a)"/>
  <path d="M260 295 C 290 295, 290 200, 318 200" fill="none" stroke="#6b7688" stroke-width="2" marker-end="url(#a)"/>

  <!-- Cross-domain perception -->
  <rect x="320" y="110" width="260" height="180" rx="10" fill="#fff" stroke="#2560db" stroke-width="2.5"/>
  <text x="450" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#2560db">Cross-domain</text>
  <text x="450" y="174" text-anchor="middle" font-size="20" font-weight="700" fill="#2560db">perception</text>
  <text x="450" y="214" text-anchor="middle" font-size="15" fill="#17202f">Multi-sensor fusion</text>
  <text x="450" y="238" text-anchor="middle" font-size="15" fill="#17202f">(camera, LiDAR)</text>
  <text x="450" y="262" text-anchor="middle" font-size="15" fill="#17202f">robust across countries</text>

  <line x1="580" y1="200" x2="628" y2="200" stroke="#6b7688" stroke-width="2" marker-end="url(#a)"/>

  <!-- LLM/VLM -->
  <rect x="630" y="110" width="260" height="180" rx="10" fill="#fff" stroke="#2560db" stroke-width="2.5"/>
  <text x="760" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#2560db">LLM/VLM-based</text>
  <text x="760" y="174" text-anchor="middle" font-size="20" font-weight="700" fill="#2560db">multimodal decision</text>
  <text x="760" y="214" text-anchor="middle" font-size="15" fill="#17202f">Scene understanding</text>
  <text x="760" y="238" text-anchor="middle" font-size="15" fill="#17202f">in language, reasoning</text>
  <text x="760" y="262" text-anchor="middle" font-size="15" fill="#17202f">over rules and context</text>

  <line x1="890" y1="200" x2="938" y2="200" stroke="#6b7688" stroke-width="2" marker-end="url(#a)"/>

  <!-- Decision -->
  <rect x="940" y="140" width="230" height="120" rx="10" fill="#2560db"/>
  <text x="1055" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Driving decision</text>
  <text x="1055" y="220" text-anchor="middle" font-size="15" fill="#dbe6ff">for AI-driven mobility</text>
</svg>
